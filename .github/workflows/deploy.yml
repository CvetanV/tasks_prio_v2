# GitHub Actions - Deploy to GitHub Pages with Neon DB secret injection
name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Allow manual trigger

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Neon DB config from GitHub Secrets
        run: |
          cat > config.js << 'SCRIPT_END'
          // Auto-generated by GitHub Actions at deploy time.
          // This file is NOT committed to the repository.
          // The connection string comes from GitHub Secrets.
          window.__NEON_CONFIG__ = {
            connectionString: "${{ secrets.NEON_CONNECTION_STRING }}"
          };
          SCRIPT_END
          echo "config.js generated successfully"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
